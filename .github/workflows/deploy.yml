name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.17.0"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # GitHub Pages 배포를 위한 토큰
          publish_dir: ./dist # 빌드된 파일들이 저장되는 디렉터리 (Vite의 기본 빌드 디렉터리)
          user_name: "github-actions" # 배포할 때의 사용자 이름 설정
          user_email: "github-actions@github.com" # 배포할 때의 사용자 이메일 설정
